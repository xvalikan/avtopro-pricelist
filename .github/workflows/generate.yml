name: Avto.pro Price Sync

on:
  schedule:
    # кожні 4 години, зі зсувом на годину від Prom, щоб не конфліктували
    - cron: '0 4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests
      - name: Generate price files
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN_avtopro }}
        run: python generate_pricelist.py
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pricelist.csv pricelist_khm.csv pricelist_lviv.csv
          git diff --staged --quiet && echo "Змін немає" && exit 0
          git commit -m "Update avto.pro price files"
          git pull --rebase --autostash
          git push
